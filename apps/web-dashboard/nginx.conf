# FleetVision web-dashboard nginx config.
# - Serves the built Vite SPA with history-fallback (client-side routing).
# - Reverse-proxies /api → identity-service:3000 so the browser's relative
#   `/api/v1` calls reach the backend without CORS.
# - Runs as the nginx-unprivileged non-root user (UID 101).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy API calls to the identity-service container.
    location /api/ {
        proxy_pass http://identity-service:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow long-lived requests (token refresh, etc.).
        proxy_read_timeout 60s;
    }

    # SPA history fallback: any non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # index.html must never be cached (it points to hashed asset bundles).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static build assets aggressively (Vite emits content-hashed names).
    # Uses /static/ (not the default /assets/) so the SPA route /assets
    # (the Asset Management page) doesn't collide with static files.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
