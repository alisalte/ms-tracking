# FleetVision web-dashboard nginx config.
# - Serves the built Vite SPA with history-fallback (client-side routing).
# - Reverse-proxies /api → identity-service:3000 so the browser's relative
#   `/api/v1` calls reach the backend without CORS.
# - Sprint E: routes the fleet-management / gps-engine / notification / fleet-service
#   prefixes the same way the Vite dev proxy does. Those upstreams use VARIABLES +
#   the docker embedded DNS resolver, so nginx still boots when a service is not
#   in the compose file (its paths just return 502 until the service exists).
# - Runs as the nginx-unprivileged non-root user (UID 101).

# Docker's embedded DNS — lets variable proxy_pass targets resolve at REQUEST
# time instead of failing config-load when a service is absent.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Sprint E service routing (mirrors vite.config.ts) -------------------

    # fleet-management: fleets / vehicles / devices / dashboard summary — plus
    # the device-command CATALOG (GET /api/v1/device-commands/… — a distinct
    # prefix from /devices; without it the catalog falls through to identity
    # and 404s, silently breaking Command Center + the config wizard).
    location ~ ^/api/v1/(fleets|vehicles|devices|device-commands|summary) {
        set $fleet_upstream http://fleet-management-service:3006;
        proxy_pass $fleet_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gps-engine REST (backend paths have NO /api/v1 prefix → stripped).
    location ~ ^/api/v1/positions/(.*)$ {
        set $gps_upstream http://gps-engine-service:3005;
        proxy_pass $gps_upstream/positions/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/v1/trips/(.*)$ {
        set $gps_upstream http://gps-engine-service:3005;
        proxy_pass $gps_upstream/trips/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/v1/tracking/devices/(.*)$ {
        set $gps_upstream http://gps-engine-service:3005;
        proxy_pass $gps_upstream/devices/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # map-engine (Sprint F): map / route / location — prefix stripped.
    location ~ ^/api/v1/(map|route|location)/(.*)$ {
        set $map_upstream http://map-engine:3009;
        proxy_pass $map_upstream/$1/$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # notification-service (alarm center) + fleet-service (drivers/trips).
    location /api/v1/notification/ {
        set $notification_upstream http://notification-service:3008;
        proxy_pass $notification_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # reporting-service (Sprint J) — controllers carry the FULL /api/v1
    # prefix, so no path rewrite (notification-style pass-through).
    location /api/v1/reports/ {
        set $reporting_upstream http://reporting-service:3011;
        proxy_pass $reporting_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/fleet/ {
        set $fleet_svc_upstream http://fleet-service:3007;
        proxy_pass $fleet_svc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Media & Video (MDVR live) ────────────────────────────────────────────
    # media-service (control plane: channels catalog, stream sessions) — its
    # controllers have NO /api/v1 prefix, so /api/v1/media/<x> → /<x>.
    location ~ ^/api/v1/media/(.*)$ {
        set $media_upstream http://media-service:3012;
        proxy_pass $media_upstream/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # mdvr-streamer REST (live stream status) — /api/v1/media-live/<x> → /<x>.
    location ~ ^/api/v1/media-live/(.*)$ {
        set $streamer_upstream http://mdvr-streamer-service:3013;
        proxy_pass $streamer_upstream/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # mdvr-streamer binary WebSocket — raw MPEG-TS bytes for JSMpeg players.
    # The first WebSocket proxy in this config: the Upgrade handshake plus a
    # long read timeout (a quiet camera sends no TS data between keyframes).
    location /media-live/ws {
        set $streamer_ws_upstream http://mdvr-streamer-service:3013;
        proxy_pass $streamer_ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- Default: identity (auth / iam / tenants) ----------------------------

    # Gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy API calls to the identity-service container.
    location /api/ {
        proxy_pass http://identity-service:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow long-lived requests (token refresh, etc.).
        proxy_read_timeout 60s;
    }

    # SPA history fallback: any non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # index.html must never be cached (it points to hashed asset bundles).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static build assets aggressively (Vite emits content-hashed names).
    # Uses /static/ (not the default /assets/) so the SPA route /assets
    # (the Asset Management page) doesn't collide with static files.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
