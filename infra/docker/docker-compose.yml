# FleetVision local lean stack (docs/specs/01_Master_Architecture.md §4.2, TDR §0/§2/§4/§5/§6).
# Brings up the shared infrastructure every service depends on for local dev.
#
#   pnpm stack:up     # docker compose -f infra/docker/docker-compose.yml up -d
#   pnpm stack:down
#
# Named volumes (no host bind) keep the DB/MinIO data portable across Windows/Linux
# (Sprint 1 plan risk note). Ports are exposed on the host only for local dev.

name: fleetvision

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: fleetvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetvision}
      POSTGRES_DB: ${POSTGRES_DB:-fleetvision}
      # TimescaleDB + PostGIS + trigram + uuid-ossp (docs/specs/03_Database_Architecture.md §4).
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - timescaledb.telemetry_level=off
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetvision} -d ${POSTGRES_DB:-fleetvision}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: fleetvision-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: fleetvision-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    # Single-broker dev profile with topic auto-create (Sprint 1 plan Deliverable 4).
    image: confluentinc/cp-kafka:7.7.1
    container_name: fleetvision-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # rabbitmq:
  #   # DEPRECATED (Sprint 2): no producer/consumer code exists for RabbitMQ yet.
  #   # Uncomment when a task-queue integration lands. (Container-only, zero code today.)
  #   image: rabbitmq:3.13-management-alpine
  #   container_name: fleetvision-rabbitmq
  #   restart: unless-stopped
  #   environment:
  #     RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fleetvision}
  #     RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fleetvision}
  #   ports:
  #     - "${RABBITMQ_AMQP_PORT:-5672}:5672"
  #     - "${RABBITMQ_MGMT_PORT:-15672}:15672"
  #   volumes:
  #     - rabbitmq-data:/var/lib/rabbitmq
  #   healthcheck:
  #     test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 10

  # minio:
  #   # DEPRECATED (Sprint 2): no S3/MinIO integration code exists yet (the
  #   # NullRawRetentionSink is a no-op). Uncomment when media/cold-storage needs it.
  #   # S3-API object storage (sovereign/edge parity, TDR §6).
  #   image: minio/minio:RELEASE.2024-10-13T13-34-11Z
  #   container_name: fleetvision-minio
  #   restart: unless-stopped
  #   command: ["server", "/data", "--console-address", ":9001"]
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fleetvision}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fleetvision-secret}
  #   ports:
  #     - "${MINIO_API_PORT:-9000}:9000"
  #     - "${MINIO_CONSOLE_PORT:-9001}:9001"
  #   volumes:
  #     - minio-data:/data
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

  # ── Application services ────────────────────────────────────────────────────
  # identity-service — NestJS auth + IAM backend. Depends on postgres + redis
  # being healthy (the bootstrap seed runs migrations + provisions the admin).
  # Builds from the repo root so the workspace @fleetvision/* packages resolve.
  identity-service:
    build:
      context: ../..
      dockerfile: apps/identity-service/Dockerfile
    container_name: fleetvision-identity
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: local
      # In-container hostnames — resolve via the compose network.
      # Runtime client connects as the non-superuser fleetvision_app role (RLS-enforced).
      # The DBURL_PLATFORM client (migrations + platform ops) connects as the
      # fleetvision_platform role (BYPASSRLS). Both roles are created by the
      # 20260201000000 hardening migration; passwords from env (dev defaults below).
      DBURL: postgres://${POSTGRES_APP_USER:-fleetvision_app}:${POSTGRES_APP_PASSWORD:-fleetvision_app_dev}@postgres:5432/${POSTGRES_DB:-fleetvision}
      DBURL_PLATFORM: postgres://${POSTGRES_PLATFORM_USER:-fleetvision_platform}:${POSTGRES_PLATFORM_PASSWORD:-fleetvision_platform_dev}@postgres:5432/${POSTGRES_DB:-fleetvision}
      REDISURL: redis://redis:6379/0
      # JWT / auth (HS256 MVP).
      JWT_ISSUER: ${JWT_ISSUER:-fleetvision}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-fleetvision-identity}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900s}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800s}
      # Password hashing (Argon2id).
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-65536}
      ARGON2_TIME: ${ARGON2_TIME:-3}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      PASSWORD_HISTORY_COUNT: ${PASSWORD_HISTORY_COUNT:-5}
      # Brute-force lockout.
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
      # Kafka (audit outbox relay) — non-fatal at boot.
      KAFKA_BROKERS: kafka:29092
      KAFKA_AUDIT_TOPIC: ${KAFKA_AUDIT_TOPIC:-fleetvision.audit.audit-entries.events}
      KAFKA_CLIENT_ID: identity-service
      # Bootstrap seed (first tenant + admin).
      SEED_TENANT_NAME: ${SEED_TENANT_NAME:-FleetVision}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@fleetvision.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe!StrongPass123}
    ports:
      - "${IDENTITY_PORT:-3000}:3000"
    healthcheck:
      # Gate dependents on readiness (HTTP + Postgres + Redis), not just process liveness.
      # Timescale can briefly refuse TCP even after pg_isready passes during cold boots,
      # so give identity enough warm-up budget to retry instead of failing the compose graph.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  # web-dashboard — Vite SPA served by nginx. Reverse-proxies /api →
  # identity-service so the browser's relative /api/v1 calls reach the backend.
  reporting-service:
    build:
      context: ../..
      dockerfile: apps/reporting-service/Dockerfile
    container_name: fleetvision-reporting
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3011"
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: local
      # Read-only analytical layer over the domain schemas (tracking +
      # notification + fleet) — the app role matches the house pattern.
      DBURL: postgres://${POSTGRES_USER:-fleetvision}:${POSTGRES_PASSWORD:-fleetvision_dev}@postgres:5432/${POSTGRES_DB:-fleetvision}
      REDISURL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-fleetvision}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-fleetvision-identity}
      REPORT_MAX_RANGE_DAYS: ${REPORT_MAX_RANGE_DAYS:-92}
      REPORT_QUERY_TIMEOUT_MS: ${REPORT_QUERY_TIMEOUT_MS:-15000}
      REPORT_CACHE_TTL_SECONDS: ${REPORT_CACHE_TTL_SECONDS:-30}
      REPORT_EXPORT_RATE_LIMIT: ${REPORT_EXPORT_RATE_LIMIT:-30}
    ports:
      - "3011:3011"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3011/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web-dashboard:
    build:
      context: ../..
      dockerfile: apps/web-dashboard/Dockerfile
    container_name: fleetvision-web
    restart: unless-stopped
    depends_on:
      identity-service:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"

  # ── Sprint G (G-0) — map-engine + optional routing/geocoding deps ──────────
  #
  # Deployment model (docs/specs/08_Map_Engine.md, MAP-1 under ADR-021/022):
  # OSRM and Nominatim are EXTERNAL, stateless, regionally-deployed services —
  # NOT platform runtime components. They are therefore NOT part of the default
  # stack: each is opt-in via a compose profile, so `pnpm stack:up` stays lean.
  #
  #   docker compose ... --profile routing up map-engine   # + OSRM routing
  #   docker compose ... --profile geocoding up map-engine # + Nominatim
  #
  # Resource notes (local dev):
  #   - osrm/osrm-backend: ~256 MB RAM idle + the loaded graph; car OSM extract
  #     for one country is typically 0.5–2 GB disk. MUST mount your own
  #     .osm.pbf at /data/map.osm.pbf (see OSRM_DATA_URL below — none bundled).
  #   - mediagris/nominatim: heavy — needs ≥2 GB RAM for import, ~1 GB idle;
  #     imports a .pbf at first boot (NOMINATIM_IMPORT_WIKIPEDIA=0 speeds it up).
  # Never point these at production public endpoints without reading their
  # usage policies; the compose defaults bind localhost only.

  map-engine:
    build:
      context: ../..
      dockerfile: apps/map-engine-service/Dockerfile
    container_name: fleetvision-map-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3009"
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: local
      # map-engine OWNS the geo + tracking.geofences DDL, so its client needs
      # the platform role for migrations (runtime reads stay tenant-scoped via
      # withTenantContext + RLS).
      DBURL: postgres://${POSTGRES_PLATFORM_USER:-fleetvision_platform}:${POSTGRES_PLATFORM_PASSWORD:-fleetvision_platform_dev}@postgres:5432/${POSTGRES_DB:-fleetvision}
      REDISURL: redis://redis:6379/0
      JWT_ISSUER: ${JWT_ISSUER:-fleetvision}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-fleetvision-identity}
      JWT_SECRET: ${JWT_SECRET}
      MAP_DEFAULT_PROVIDER: ${MAP_DEFAULT_PROVIDER:-local}
      MAP_PROVIDER_REGION: ${MAP_PROVIDER_REGION:-global}
      # External deps are wired by URL — never hardcoded. Empty = controlled
      # 503 fallback (Sprint F §13); set when the profile containers run.
      OSRM_URL: ${OSRM_URL:-}
      OSRM_PROFILE: ${OSRM_PROFILE:-driving}
      NOMINATIM_URL: ${NOMINATIM_URL:-}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-FleetVision-MapEngine/1.0}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      MAP_CACHE_TTL_SECONDS: ${MAP_CACHE_TTL_SECONDS:-300}
    ports:
      - "${MAP_ENGINE_PORT:-3009}:3009"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3009/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  osrm:
    # Opt-in (`--profile routing`). Stateless routing engine on a loaded graph.
    # The image is a car profile; mount your extract at /data/map.osm.pbf —
    # without data the container exits (intentional: no bundled map data).
    image: osrm/osrm-backend:latest
    container_name: fleetvision-osrm
    restart: unless-stopped
    profiles: ["routing"]
    command: ["osrm-routed", "--algorithm", "mld", "/data/map.osm.pbf"]
    volumes:
      - ./osrm-data:/data
    ports:
      - "${OSRM_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5000/route/v1/driving/0,0;0,0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nominatim:
    # Opt-in (`--profile geocoding`). Self-hosted geocoder; imports the PBF at
    # first boot (slow — minutes to hours depending on extract size).
    image: mediagis/nominatim:4.4
    container_name: fleetvision-nominatim
    restart: unless-stopped
    profiles: ["geocoding"]
    environment:
      PBF_PATH: /nominatim/data/map.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/nominatim-updates.txt
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-fleetvision_dev}
      # ≤4 threads / no update loop keeps dev resource use bounded.
      THREADS: 2
      IMPORT_WIKIPEDIA: "false"
    volumes:
      - ./nominatim-data:/nominatim/data
    ports:
      - "${NOMINATIM_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  # ── Sprint H (optional) — Mailpit: local SMTP test sink ────────────────────
  #
  # Dev-only SMTP catcher for the notification-service EMAIL channel: point
  # NOTIF_SMTP_HOST at it (localhost:1025) and read captured messages in the
  # web UI (http://localhost:8025). Opt-in via the `mail` profile so the
  # default dev stack stays lean; NEVER use for real recipients.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: fleetvision-mailpit
    restart: unless-stopped
    profiles: ["mail"]
    environment:
      SMTP_MAX_MESSAGE_SIZE: "10485760"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8025/livez || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
